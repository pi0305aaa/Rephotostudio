<main class="main reservation-page">
<section class="reservation-form">

  <h1>RESERVATION/CONTACT</h1>
  <p class="reservation-subtitle">ご予約・お問い合わせフォーム</p>

  <div class="form-line"></div>


  <form action="" class="contact-form">


   
<!-- ご予約 / お問い合わせ -->
<div class="form-item">
  <label for="category">
    <i class="fa fa-paper-plane form-icon"></i>
    件名
  </label>

  <select id="category" name="category" required>
    <option value="" selected disabled>選択してください</option>
    <option value="reservation">ご予約</option>
    <option value="contact">お問い合わせ</option>
  </select>
</div>


<!-- お名前 -->
<div class="form-item">
  <label>
    <i class="fa fa-user form-icon"></i>
    お名前
  </label>

  <div class="name-row">
    <input type="text" name="last-name" placeholder="姓" aria-label="姓" required>
    <input type="text" name="first-name" placeholder="名" aria-label="名" required>
  </div>
</div>


<!-- お名前（カタカナ） -->
<div class="form-item">
  <label>
    <i class="fa fa-user form-icon"></i>
  お名前(カタカナ)
  </label>

  <div class="name-row">
    <input type="text" name="last-name-kana" placeholder="セイ" aria-label="セイ" required>
    <input type="text" name="first-name-kana" placeholder="メイ" aria-label="メイ" required>
  </div>
</div>


<!-- メールアドレス -->
<div class="form-item">
  <label for="email">
    <i class="fa fa-envelope form-icon"></i>
    メールアドレス
  </label>

  <input type="email" id="email" name="email" required
  placeholder="メールアドレス">
</div>


<!-- メールアドレス確認 -->
<div class="form-item">
  <input
    type="email"
    name="email-confirm"
    placeholder="確認用"
    aria-label="メールアドレス確認"
    required
  >
</div>


<!-- 電話番号 -->
<div class="form-item">
  <label for="phone">
    <i class="fa fa-phone form-icon"></i>
    お電話番号
  </label>

  <input type="tel" id="phone" name="phone" required
  placeholder="電話番号">
</div>


<!-- 撮影希望日 -->
<div class="form-item">
  <label for="preferred-date">
    <i class="fa fa-calendar form-icon"></i>
    撮影希望日（任意）
  </label>

  <input type="date" id="preferred-date" name="preferred-date">
</div>


<!-- お問い合わせ内容 -->
<div class="form-item message-item">
  <label for="message">
    <i class="fa fa-envelope form-icon"></i>
    内容
  </label>

  <textarea
    id="message"
    name="message"
    placeholder="お問い合わせ内容"
    rows="6"
  ></textarea>
</div>


<!-- 送信 -->
<div class="submit-area">
  <button type="submit" class="submit-button">
    送信
  </button>
</div>

</form>
</section>
